<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Vault</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <h1>Privacy Vault</h1>
        <input type="text" id="password" placeholder="Enter Password" required>
        <button id="lock">Lock</button>
        <button id="unlock" disabled>Unlock</button>
        <div id="vault-content" style="display: none;">
            <textarea id="content" placeholder="Your secret content here..."></textarea>
            <button id="save">Save</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
